server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https:; frame-src blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  location / {
    expires -1;
    try_files $uri $uri/ =404;
  }
  location ~ ^/(admin|uye)/?$ {
    expires -1;
    try_files /index.html =404;
  }
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }
}
