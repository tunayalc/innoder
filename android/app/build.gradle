apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def keystoreProperties = new Properties()
def unsignedVerification = project.findProperty('innoUnsignedVerification') == 'true'
def storeRelease = project.findProperty('innoStoreRelease') == 'true'
if (unsignedVerification && storeRelease) {
    throw new GradleException('A store release cannot use unsigned verification mode.')
}
def keystorePropertiesFile = rootProject.file("keystore.properties")
def releaseSigningKeys = ['INNO_UPLOAD_STORE_FILE', 'INNO_UPLOAD_STORE_PASSWORD', 'INNO_UPLOAD_KEY_ALIAS', 'INNO_UPLOAD_KEY_PASSWORD']
if (!unsignedVerification) {
    def environmentSigning = releaseSigningKeys.collectEntries { key -> [key, System.getenv(key)] }
    if (environmentSigning.values().any { it != null }) {
        if (!environmentSigning.values().every { it }) {
            throw new GradleException('Release signing environment must provide all upload keystore settings.')
        }
        keystoreProperties.putAll(environmentSigning)
    } else if (keystorePropertiesFile.exists()) {
        keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    }
}
def hasReleaseSigning = releaseSigningKeys.every { keystoreProperties[it] }
def debugReleaseKey = hasReleaseSigning && (
    keystoreProperties['INNO_UPLOAD_STORE_FILE'].toLowerCase().contains('debug.keystore') ||
    keystoreProperties['INNO_UPLOAD_KEY_ALIAS'].toLowerCase() == 'androiddebugkey'
)
if (debugReleaseKey && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    throw new GradleException('Release signing cannot use an Android debug key.')
}
if (storeRelease && !hasReleaseSigning) {
    throw new GradleException('Store release requires the institution upload keystore.')
}
if (hasReleaseSigning && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    def releaseStore = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
    try {
        rootProject.file(keystoreProperties['INNO_UPLOAD_STORE_FILE']).withInputStream { stream ->
            releaseStore.load(stream, keystoreProperties['INNO_UPLOAD_STORE_PASSWORD'].toCharArray())
        }
        def certificate = releaseStore.getCertificate(keystoreProperties['INNO_UPLOAD_KEY_ALIAS'])
        if (certificate == null || certificate.subjectX500Principal.name.toLowerCase().contains('cn=android debug')) {
            throw new GradleException('Release signing requires a non-debug institution certificate.')
        }
    } catch (java.security.GeneralSecurityException ignored) {
        throw new GradleException('Release signing certificate could not be validated.')
    }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

abstract class InnoFontAssets extends DefaultTask {
    @InputDirectory abstract DirectoryProperty getInputDirectory()
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()
    @javax.inject.Inject abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void syncFonts() {
        fileSystemOperations.sync {
            from(inputDirectory) {
                include 'Inter-*.ttf', 'OFL.txt'
                into 'fonts'
            }
            into(outputDirectory)
        }
    }
}

// Register generated assets with AGP so packaging and lint share the dependency.
androidComponents {
    onVariants(selector().all()) { variant ->
        def copyFonts = tasks.register("copy${variant.name.capitalize()}InnoFonts", InnoFontAssets) {
            inputDirectory.set(layout.projectDirectory.dir('../../src/assets/fonts'))
        }
        variant.sources.assets.addGeneratedSourceDirectory(copyFonts) { it.outputDirectory }
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "org.innoassociation.mobile"
    defaultConfig {
        applicationId "org.innoassociation.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.2"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProperties['INNO_UPLOAD_STORE_FILE'])
                storePassword keystoreProperties['INNO_UPLOAD_STORE_PASSWORD']
                keyAlias keystoreProperties['INNO_UPLOAD_KEY_ALIAS']
                keyPassword keystoreProperties['INNO_UPLOAD_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
